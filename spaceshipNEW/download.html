<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { min-height:100%; background:#000; color:#fff;
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  body { display:flex; flex-direction:column; min-height:100dvh; }
  .top { display:flex; justify-content:center; padding:28px 16px 0; }
  .pill {
    display:inline-flex; align-items:center; gap:8px;

  }
  .pill span { color:#8b8b8b; }
  main {
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:48px 20px 80px;
  }
  h1 { font-size: clamp(44px, 8vw, 84px); font-weight: 600; letter-spacing: -.04em; line-height: .95; }
  h1 img { width: .82em; height: .82em; vertical-align: -0.08em; margin: 0 .12em; border-radius: 18%; }
  .lead { color:#8b8b8b; font-size: clamp(16px, 2.2vw, 20px); max-width: 560px; line-height: 1.55; margin: 22px auto 36px; }
  .cta { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
  .btn {
    display:inline-flex; align-items:center; justify-content:center; gap:10px;
    height:48px; padding:0 22px; border-radius:999px; font: 600 15px/1 inherit;
    text-decoration:none; border:1px solid transparent; cursor:pointer; background:#fff; color:#000;
  }
  .btn.ghost { background:transparent; color:#fff; border-color:#333; }
  .btn:hover { filter:brightness(1.06); }
  .meta { margin-top:28px; color:#6f6f6f; font-size:13px; min-height:1.4em; }
  .meta b { color:#cfcfcf; font-weight:600; }
  .notes { max-width:480px; margin:28px auto 0; text-align:left; }
  .notes li { list-style:none; color:#9a9a9a; font-size:13.5px; line-height:1.5; padding:8px 0;
    border-bottom:1px solid #1a1a1a; }
  .notes li:last-child { border-bottom:0; }
  .tag { display:inline-block; font-size:10px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
    color:#f08a24; border:1px solid rgba(240,138,36,.35); border-radius:999px; padding:2px 8px; margin-right:8px; }
  footer { padding: 0 20px 28px; text-align:center; color:#555; font-size:12px; }

</head>
<body>
  <div class="top">
    <a class="pill" href="/">Hive is here <span>·</span> Back to the site</a>

    <p class="lead">Windows installer. Direct download of the newest published build. Sign in at hivetools.pro inside the app.</p>
    <div class="cta">
      <a class="btn" id="dl" href="https://github.com/samkomedved319-dev/Hive-Desktop/releases/download/0.0.1.5/Hive-Setup-0.0.1.5.exe">Download 0.0.1.5</a>
      <a class="btn ghost" href="https://github.com/samkomedved319-dev/Hive-Desktop/releases">All releases</a>

<script>
(function () {
  var FALLBACK = {
    version: '0.0.1.5',
    fileUrl: 'https://github.com/samkomedved319-dev/Hive-Desktop/releases/download/0.0.1.5/Hive-Setup-0.0.1.5.exe',
    size: 157581551
  };
  var API = 'https://api.github.com/repos/samkomedved319-dev/Hive-Desktop';
  var dl = document.getElementById('dl');
  var meta = document.getElementById('meta');
  var notes = document.getElementById('notes');
  function bytes(n) {
    n = Number(n || 0);
    if (!n) return '';
    if (n < 1024 * 1024) return Math.round(n / 1024) + ' KB';
    return (n / (1024 * 1024)).toFixed(1) + ' MB';
  }
  function useInstaller(version, url, size) {
    if (!url) return;
    dl.href = url;
    dl.textContent = 'Download ' + version;
    var extra = size ? ' · ' + bytes(size) : '';
    meta.innerHTML = 'Version <b>' + version + '</b> · Windows 10 / 11' + extra;
  }
  function exeFromRelease(rel) {
    if (!rel || !rel.assets) return null;
    var a = null;
    for (var i = 0; i < rel.assets.length; i++) {
      if (/\.exe$/i.test(rel.assets[i].name || '')) { a = rel.assets[i]; break; }
    }
    if (!a || !a.browser_download_url) return null;
    return { version: String(rel.tag_name || rel.name || '').replace(/^v/, ''), fileUrl: a.browser_download_url, size: a.size };
  }
  function getJson(url) {
    return fetch(url, { headers: { Accept: 'application/vnd.github+json' } })
      .then(function (r) { return r.ok ? r.json() : null; })
      .catch(function () { return null; });
  }
  useInstaller(FALLBACK.version, FALLBACK.fileUrl, FALLBACK.size);
  getJson(API + '/releases/latest').then(function (latest) {
    var hit = exeFromRelease(latest);
    if (hit) useInstaller(hit.version, hit.fileUrl, hit.size);
  });
  fetch('https://raw.githubusercontent.com/samkomedved319-dev/HiveSOURCE/main/latest.json?t=' + Date.now())
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (j) {
      if (!j || !j.notes || !j.notes.length || !notes) return;
      notes.hidden = false;
      notes.innerHTML = j.notes.map(function (n) {
        var kind = (n && n.type) || 'note';
        var text = (n && n.text) || String(n);
        return '<li><span class="tag">' + kind + '</span>' + text + '</li>';
      }).join('');
    }).catch(function () {});
})();
</script>
