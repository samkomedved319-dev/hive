<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Hive — admin</title>
<link rel="icon" type="image/png" href="logohive.png" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root { --bg:#000; --s1:#16181c; --line:#2f3336; --text:#e7e9ea; --dim:#71767b; --orange:#f08a24; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; }
  .wrap { max-width:880px; margin:0 auto; padding:28px 20px 80px; }
  a { color:#1d9bf0; text-decoration:none; }
  h1 { font-size:28px; letter-spacing:-.03em; }
  .sub { color:var(--dim); margin:8px 0 28px; font-size:14.5px; }
  .row { background:var(--s1); border:1px solid var(--line); border-radius:14px; padding:16px 18px; margin-bottom:10px; display:flex; gap:14px; align-items:center; justify-content:space-between; flex-wrap:wrap; }
  .who b { display:block; font-size:15px; }
  .who span { font-size:12.5px; color:var(--dim); }
  .badge { font-size:11px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; padding:4px 8px; border-radius:999px; }
  .pending { color:#F2C14E; background:rgba(242,193,78,.12); }
  .approved { color:#10B981; background:rgba(16,185,129,.12); }
  .denied { color:#F04438; background:rgba(240,68,56,.12); }
  .none { color:var(--dim); background:rgba(113,118,123,.14); }
  button, .btn { font-family:inherit; cursor:pointer; border-radius:10px; padding:8px 12px; font-size:13px; font-weight:600; border:1px solid var(--line); background:transparent; color:var(--text); }
  button.ok { background:#10B981; color:#000; border:none; }
  button.no { background:#F04438; color:#fff; border:none; }
  button.primary { background:var(--orange); color:#000; border:none; min-height:44px; padding:10px 16px; border-radius:999px; }
  .acts { display:flex; gap:8px; }
  #msg, #rel-msg { color:var(--dim); margin-bottom:16px; font-size:14px; }
  label { display:block; font-size:12px; color:var(--dim); margin:12px 0 6px; }
  input, textarea {
    width:100%; background:var(--s1); border:1px solid var(--line); border-radius:12px;
    color:var(--text); font:14px inherit; padding:11px 14px;
  }
  textarea { min-height:120px; resize:vertical; }
  .form { background:var(--s1); border:1px solid var(--line); border-radius:16px; padding:18px; margin-bottom:22px; }
  pre { white-space:pre-wrap; background:#0b0c10; border:1px solid var(--line); border-radius:12px; padding:12px; font-size:12px; color:#c9ccd1; display:none; margin-top:12px; }
</style>
</head>
<body>
<div class="wrap">
  <p style="margin-bottom:18px;"><a href="index.html">← Hive</a> · <a href="download-win.html">Download page</a></p>
  <h1>Waitlist review</h1>
  <p class="sub">Approve members. Feedback from the desktop app appears below.</p>
  <p id="msg">Loading…</p>
  <div id="list"></div>
  <div id="emails" style="margin-top:18px;"></div>

  <h1 style="margin-top:48px;">Installer releases</h1>
  <p class="sub">Publish a Windows build. It shows on the private download page — no GitHub login.</p>
  <p id="rel-msg"></p>
  <form class="form" id="rel-form">
    <label for="rel-version">Version</label>
    <input id="rel-version" required placeholder="0.0.4" />
    <label for="rel-title">Name</label>
    <input id="rel-title" required placeholder="Hive 0.0.4" />
    <label for="rel-notes">What’s new</label>
    <textarea id="rel-notes" placeholder="Command palette, swarm, Allow/Deny…"></textarea>
    <label for="rel-file">Installer (.exe)</label>
    <input id="rel-file" type="file" accept=".exe,.msi" required />
    <div style="margin-top:16px;"><button class="primary" type="submit">Publish this version</button></div>
  </form>
  <pre id="setup-sql"></pre>
  <div id="releases"></div>

  <h1 style="margin-top:36px;">Feedback</h1>
  <p class="sub">Reviews sent from Hive desktop.</p>
  <div id="fb"></div>
</div>
<script>
  var SUPABASE_URL = 'https://nqkmnmwbmikbgopwkvse.supabase.co';
  var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5xa21ubXdibWlrYmdvcHdrdnNlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg0NjMyOTksImV4cCI6MjEwNDAzOTI5OX0.5hu89H56db0OxrEIJUIXSn7O_qP9f4yML_W0Vy8ATMU';
  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  var msg = document.getElementById('msg');
  var list = document.getElementById('list');
  var SETUP = `-- Run once in Supabase → SQL Editor\ninsert into storage.buckets (id, name, public)\n  values ('installers', 'installers', true)\n  on conflict (id) do nothing;\n\ncreate table if not exists public.releases (\n  id uuid primary key default gen_random_uuid(),\n  version text not null,\n  title text not null,\n  notes text,\n  filename text not null,\n  file_path text not null,\n  file_url text,\n  file_size bigint,\n  is_latest boolean not null default true,\n  created_at timestamptz not null default now()\n);\nalter table public.releases enable row level security;\ndrop policy if exists \"public read releases\" on public.releases;\ncreate policy \"public read releases\" on public.releases for select using (true);\ndrop policy if exists \"admin write releases\" on public.releases;\ncreate policy \"admin write releases\" on public.releases for all\n  using (exists (select 1 from public.profiles p where p.id = auth.uid() and p.is_admin = true))\n  with check (exists (select 1 from public.profiles p where p.id = auth.uid() and p.is_admin = true));\n\ndrop policy if exists \"public read installers\" on storage.objects;\ncreate policy \"public read installers\" on storage.objects for select using (bucket_id = 'installers');\ndrop policy if exists \"admin write installers\" on storage.objects;\ncreate policy \"admin write installers\" on storage.objects for all\n  using (bucket_id = 'installers' and exists (select 1 from public.profiles p where p.id = auth.uid() and p.is_admin = true))\n  with check (bucket_id = 'installers' and exists (select 1 from public.profiles p where p.id = auth.uid() and p.is_admin = true));`;

  async function boot() {
    var s = await sb.auth.getSession();
    var user = s.data && s.data.session && s.data.session.user;
    if (!user) { msg.textContent = 'Sign in on the homepage first, then open this page.'; return; }
    var me = await sb.from('profiles').select('*').eq('id', user.id).maybeSingle();
    if (!me.data || !me.data.is_admin) { msg.textContent = 'Admins only. In Supabase profiles, set is_admin = true on your row.'; return; }
    await load();
    await loadFb();
    await loadReleases();
    await loadEmails();
  }
  async function loadFb() {
    var box = document.getElementById('fb');
    if (!box) return;
    var r = await sb.from('feedback').select('*').order('created_at', { ascending: false }).limit(50);
    if (r.error) { box.innerHTML = '<p class="sub">' + escapeHtml(r.error.message) + '</p>'; return; }
    var rows = r.data || [];
    if (!rows.length) { box.innerHTML = '<p class="sub">No feedback yet.</p>'; return; }
    box.innerHTML = rows.map(function (p) {
      return '<div class="row"><div class="who"><b>' + escapeHtml(p.email || 'anon') + '</b><span>★' + (p.rating || '-') + ' · ' + escapeHtml(p.body || '') + '</span></div><span class="badge pending">' + escapeHtml(p.status || 'pending') + '</span></div>';
    }).join('');
  }
  async function load() {
    var r = await sb.rpc('admin_waitlist');
    if (r.error) { msg.textContent = r.error.message; return; }
    var rows = r.data || [];
    if (typeof rows === 'string') try { rows = JSON.parse(rows); } catch (e) { rows = []; }
    msg.textContent = rows.length + ' members.';
    rows.sort(function (a, b) { var o = { pending: 0, none: 1, approved: 2, denied: 3 }; return (o[a.status] || 9) - (o[b.status] || 9); });
    list.innerHTML = rows.map(function (p) {
      var when = p.waitlist_at || p.created_at;
      var whenTxt = when ? new Date(when).toLocaleString() : '';
      var acts = p.status === 'pending' ? '<div class="acts"><button class="ok" onclick="review(\'' + p.id + '\',\'approved\')">Approve</button><button class="no" onclick="review(\'' + p.id + '\',\'denied\')">Decline</button></div>' : '<div class="acts"></div>';
      return '<div class="row"><div class="who"><b>' + escapeHtml(p.display_name || p.email || p.id) + '</b><span>' + escapeHtml(p.email || '') + ' · ' + whenTxt + '</span></div><span class="badge ' + p.status + '">' + p.status + '</span>' + acts + '</div>';
    }).join('');
  }
  async function loadEmails() {
    var box = document.getElementById('emails');
    if (!box) return;
    var r = await sb.from('waitlist_emails').select('*').order('created_at', { ascending: false });
    if (r.error) { box.innerHTML = ''; return; }
    var rows = r.data || [];
    if (!rows.length) { box.innerHTML = '<p class="sub">No extra waitlist emails.</p>'; return; }
    box.innerHTML = '<p class="sub">' + rows.length + ' emails joined from the homepage form.</p>' + rows.map(function (p) {
      return '<div class="row"><div class="who"><b>' + escapeHtml(p.email) + '</b><span>' + (p.created_at ? new Date(p.created_at).toLocaleString() : '') + '</span></div><span class="badge pending">email</span></div>';
    }).join('');
  }
  function escapeHtml(s) { return String(s || '').replace(/[&<>\"']/g, function (c) { return ({ '&':'&', '<':'<', '>':'>', '\"':'"', \"'\":'&#39;' })[c]; }); }
  async function review(id, decision) {
    var note = decision === 'denied' ? (window.prompt('Optional note for this decline:') || null) : null;
    var r = await sb.rpc('review_waitlist', { target: id, decision: decision, note: note });
    if (r.error) { msg.textContent = r.error.message; return; }
    await load();
  }
  function showSetup(err) {
    var el = document.getElementById('setup-sql');
    el.style.display = 'block';
    el.textContent = (err ? err + '\n\n' : '') + SETUP;
    document.getElementById('rel-msg').textContent = 'Run the SQL below once in Supabase, then publish again.';
  }
  async function loadReleases() {
    var box = document.getElementById('releases');
    var r = await sb.from('releases').select('*').order('created_at', { ascending: false });
    if (r.error) { showSetup(r.error.message); box.innerHTML = ''; return; }
    document.getElementById('setup-sql').style.display = 'none';
    var rows = r.data || [];
    if (!rows.length) { box.innerHTML = '<p class="sub">No releases yet.</p>'; return; }
    box.innerHTML = rows.map(function (p) {
      var tag = p.is_latest ? '<span class="badge approved">latest</span>' : '';
      return '<div class="row"><div class="who"><b>' + escapeHtml(p.title || p.version) + '</b><span>v' + escapeHtml(p.version) + ' · ' + escapeHtml(p.filename || '') + '</span></div>' + tag + '<div class="acts"><button class="no" onclick="delRel(\'' + p.id + '\',\'' + escapeHtml(p.file_path || '') + '\')">Remove</button></div></div>';
    }).join('');
  }
  async function delRel(id, path) {
    if (!window.confirm('Remove this version?')) return;
    if (path) await sb.storage.from('installers').remove([path]);
    await sb.from('releases').delete().eq('id', id);
    await loadReleases();
  }
  document.getElementById('rel-form').addEventListener('submit', async function (e) {
    e.preventDefault();
    var version = document.getElementById('rel-version').value.trim();
    var title = document.getElementById('rel-title').value.trim();
    var notes = document.getElementById('rel-notes').value.trim();
    var file = document.getElementById('rel-file').files[0];
    if (!file) return;
    var filename = file.name || ('HiveSetup-' + version + '.exe');
    var path = version + '/' + filename;
    document.getElementById('rel-msg').textContent = 'Uploading ' + filename + ' (' + Math.round(file.size / 1048576) + ' MB)…';
    var up = await sb.storage.from('installers').upload(path, file, { upsert: true });
    if (up.error) {
      var retry = await sb.storage.from('installers').remove([path]);
      up = await sb.storage.from('installers').upload(path, file, { upsert: true });
    }
    if (up.error) {
      document.getElementById('rel-msg').textContent = 'Upload failed: ' + up.error.message + (up.error.message && up.error.message.indexOf('admin') >= 0 ? ' Sign in as the admin account on the homepage first.' : '');
      return;
    }
    var pub = sb.storage.from('installers').getPublicUrl(path);
    await sb.from('releases').update({ is_latest: false }).eq('is_latest', true);
    var ins = await sb.from('releases').insert({
      version: version,
      title: title,
      notes: notes,
      filename: filename,
      file_path: path,
      file_url: pub.data && pub.data.publicUrl,
      file_size: file.size,
      is_latest: true
    });
    if (ins.error) { document.getElementById('rel-msg').textContent = 'Saved file but could not list it: ' + ins.error.message; return; }
    document.getElementById('rel-msg').textContent = 'Published v' + version + '.';
    e.target.reset();
    await loadReleases();
  });
  window.review = review;
  window.delRel = delRel;
  boot();
</script>
</body>
</html>
