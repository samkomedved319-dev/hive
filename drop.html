<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Hive drop</title>
<meta name="robots" content="noindex, nofollow, noarchive" />
<meta name="googlebot" content="noindex, nofollow, noarchive" />
<meta name="description" content="" />
<link rel="icon" type="image/png" href="logohive.png" />
<style>
  :root {
    --bg: #000000;
    --surface: #16181c;
    --line: #2f3336;
    --text: #e7e9ea;
    --dim: #71767b;
    --honey: #f08a24;
    --ok: #10b981;
    --ease: cubic-bezier(.16, .8, .24, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100dvh;
    background: var(--bg);
    color: var(--text);
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
  }
  .card {
    width: min(480px, 100%);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 28px 24px 24px;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; }
  .brand img { border-radius: 8px; }
  .ver {
    margin-left: auto;
    font-size: 11px;
    color: var(--dim);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 3px 10px;
  }
  h1 { font-size: 26px; letter-spacing: -.03em; margin: 22px 0 8px; }
  p { color: var(--dim); font-size: 14.5px; line-height: 1.6; }
  .notes {
    margin: 16px 0 22px;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 12px;
    font-size: 13.5px;
    color: var(--text);
  }
  .notes span { color: var(--dim); display: block; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; margin-bottom: 6px; }
  .btn {
    display: flex; align-items: center; justify-content: center;
    min-height: 48px; width: 100%;
    border-radius: 999px; font-weight: 600; font-size: 14px;
    text-decoration: none; font-family: inherit; cursor: pointer; border: 0;
  }
  .btn.primary { background: var(--honey); color: #000; }
  .btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); margin-top: 8px; }
  .btn[aria-disabled="true"] { opacity: .45; pointer-events: none; }
  .meta { margin-top: 16px; font-size: 12.5px; color: var(--dim); }
  .meta b { color: var(--ok); font-weight: 600; }
  .warn { margin-top: 12px; font-size: 13px; color: var(--honey); display: none; }
</style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <img src="logohive.png" alt="" width="28" height="28" />
      Hive
      <span class="ver" id="ver">…</span>
    </div>
    <h1>Windows installer</h1>
    <p>Private drop. This page is not listed on the site. Windows 10 / 11.</p>
    <div class="notes"><span>This build</span><div id="notes">Loading…</div></div>
    <a class="btn primary" id="dl-page" href="#" aria-disabled="true">Download from this page</a>
    <a class="btn ghost" id="dl-gh" href="#" target="_blank" rel="noopener noreferrer">GitHub copy (sign-in may be required)</a>
    <p class="warn" id="missing">The file is not on this page yet. Use the GitHub copy, or wait for the next drop.</p>
    <p class="meta" id="meta"></p>
  </main>
<script>
(function () {
  var FALLBACK = {
    version: "0.0.3",
    filename: "HiveSetup-0.0.3.exe",
    pageFile: "builds/HiveSetup-0.0.3.exe",
    githubRelease: "https://github.com/samkomedved319-dev/hive/releases/download/v0.0.3/HiveSetup-0.0.3.exe",
    notes: "Command palette, swarm, Allow/Deny, tray, chips, ink.",
    minOs: "Windows 10 / 11",
    released: ""
  };

  function paint(v) {
    document.getElementById("ver").textContent = "v" + v.version;
    document.getElementById("notes").textContent = v.notes || ("Hive v" + v.version);
    var page = document.getElementById("dl-page");
    var gh = document.getElementById("dl-gh");
    page.setAttribute("href", v.pageFile);
    page.setAttribute("download", v.filename);
    page.textContent = "Download " + v.filename;
    gh.setAttribute("href", v.githubRelease);
    var bits = ["v" + v.version];
    if (v.minOs) bits.push(v.minOs);
    if (v.released) bits.push(v.released);
    document.getElementById("meta").innerHTML = bits.join(" · ");
    fetch(v.pageFile, { method: "HEAD" }).then(function (r) {
      if (r.ok) {
        page.removeAttribute("aria-disabled");
        document.getElementById("meta").innerHTML = "<b>Ready on this page</b> · " + bits.join(" · ");
      } else {
        document.getElementById("missing").style.display = "block";
      }
    }).catch(function () {
      document.getElementById("missing").style.display = "block";
    });
  }

  fetch("builds/version.json", { cache: "no-store" })
    .then(function (r) { return r.ok ? r.json() : FALLBACK; })
    .then(paint)
    .catch(function () { paint(FALLBACK); });
})();
</script>
</body>
</html>
