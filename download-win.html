<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Download Hive for Windows</title>
<meta name="robots" content="noindex, nofollow, noarchive" />
<link rel="icon" type="image/png" href="logohive.png" />
<style>
  :root { --bg:#050506; --card:#12141a; --line:#2a2d34; --text:#e7e9ea; --dim:#8b9098; --honey:#f08a24; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    min-height:100dvh; background:var(--bg); color:var(--text);
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    display:flex; align-items:center; justify-content:center; padding:48px 20px;
  }
  .panel {
    width:min(440px,100%); background:var(--card); border:1px solid var(--line);
    border-radius:22px; padding:36px 28px; text-align:center;
  }
  .logo { display:flex; align-items:center; justify-content:center; gap:10px; font-weight:700; margin-bottom:22px; }
  .logo img { border-radius:8px; }
  h1 { font-size:28px; letter-spacing:-.03em; line-height:1.2; }
  p { margin-top:10px; color:var(--dim); font-size:15px; line-height:1.5; }
  a.btn {
    margin-top:24px; display:flex; align-items:center; justify-content:center;
    min-height:52px; border-radius:999px; background:var(--honey); color:#000;
    font-weight:700; font-size:15px; text-decoration:none;
  }
  a.ghost { display:block; margin-top:14px; color:var(--dim); font-size:13px; }
</style>
</head>
<body>
  <div class="panel">
    <div class="logo"><img src="logohive.png" alt="" width="28" height="28" /> Hive</div>
    <h1>Download Hive for Windows</h1>
    <p>Installer is on GitHub Releases. No account needed — works on any device.</p>
    <a class="btn" href="https://github.com/samkomedved319-dev/hive-releases/releases/latest">Get the latest build</a>
    <a class="ghost" href="https://github.com/samkomedved319-dev/hive-releases/releases">All versions</a>
  </div>
</body>
</html>
