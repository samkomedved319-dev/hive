<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Meet Hive</title>
<link rel="icon" type="image/png" href="logohive.png" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { min-height:100%; background:#000; color:#fff; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  body { display:flex; flex-direction:column; min-height:100dvh; }
  .top { display:flex; justify-content:center; padding:28px 16px 0; }
  .pill {
    display:inline-flex; align-items:center; gap:8px;
    border:1px solid #2a2a2a; background:#111; color:#ddd;
    border-radius:999px; padding:8px 14px; font-size:13px; text-decoration:none;
  }
  .pill span { color:#8b8b8b; }
  main {
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:48px 20px 80px;
  }
  h1 { font-size: clamp(44px, 8vw, 84px); font-weight: 600; letter-spacing: -.04em; line-height: .95; }
  h1 img { width: .82em; height: .82em; vertical-align: -0.08em; margin: 0 .12em; border-radius: 18%; }
  .lead { color:#8b8b8b; font-size: clamp(16px, 2.2vw, 20px); max-width: 560px; line-height: 1.55; margin: 22px auto 36px; }
  .cta { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
  .btn {
    display:inline-flex; align-items:center; justify-content:center; gap:10px;
    height:48px; padding:0 22px; border-radius:999px; font: 600 15px/1 inherit;
    text-decoration:none; border:1px solid transparent; cursor:pointer; background:#fff; color:#000;
  }
  .btn:disabled { opacity:.5; cursor:wait; }
  .btn.ghost { background:transparent; color:#fff; border-color:#333; }
  .meta { margin-top:28px; color:#6f6f6f; font-size:13px; min-height:1.4em; }
  .meta b { color:#cfcfcf; font-weight:600; }
  footer { padding: 0 20px 28px; text-align:center; color:#555; font-size:12px; }
</style>
</head>
<body>
  <div class="top">
    <a class="pill" href="index.html">Hive is here <span>·</span> Back to the site</a>
  </div>
  <main>
    <h1>Meet <img src="logohive.png" alt="" /> Hive</h1>
    <p class="lead">A Windows workspace for concurrent agents. Give them real work. They search, write, and come back with finished work.</p>
    <div class="cta">
      <button class="btn" type="button" id="dl" disabled>Download for Windows</button>
      <a class="btn ghost" href="index.html">Contact / waitlist</a>
    </div>
    <p class="meta" id="meta">Looking up the latest installer…</p>
  </main>
  <footer>Windows 10 / 11 · Hive 0.0.1.4</footer>
<script>
  var sb = window.supabase.createClient(
    'https://nqkmnmwbmikbgopwkvse.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5xa21ubXdibWlrYmdvcHdrdnNlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg0NjMyOTksImV4cCI6MjEwNDAzOTI5OX0.5hu89H56db0OxrEIJUIXSn7O_qP9f4yML_W0Vy8ATMU'
  );
  var dl = document.getElementById('dl');
  var meta = document.getElementById('meta');
  var FALLBACK_URL = 'https://github.com/samkomedved319-dev/hive-releases/releases/download/v0.0.1.4/Hive-Setup-0.0.1.4.exe';
  var FALLBACK_NAME = 'Hive-Setup-0.0.1.4.exe';
  var FALLBACK_VER = '0.0.1.4';
  var fileUrl = FALLBACK_URL;
  var fileName = FALLBACK_NAME;

  function isGithub(u) {
    return /github\.com/i.test(u || '');
  }

  function useFallback() {
    fileUrl = FALLBACK_URL;
    fileName = FALLBACK_NAME;
    dl.disabled = false;
    meta.innerHTML = 'Version <b>' + FALLBACK_VER + '</b> · Windows 10 / 11 · starts in this tab';
  }

  sb.from('releases').select('*').eq('is_latest', true).order('created_at', { ascending: false }).limit(1)
    .then(function (r) {
      var row = r.data && r.data[0];
      if (!row || !row.file_url || isGithub(row.file_url)) {
        useFallback();
        return;
      }
      fileUrl = row.file_url;
      fileName = row.filename || ('Hive-Setup-' + (row.version || '') + '.exe');
      dl.disabled = false;
      meta.innerHTML = 'Version <b>' + (row.version || FALLBACK_VER) + '</b> · Windows 10 / 11 · starts in this tab';
    })
    .catch(function () {
      useFallback();
    });

  dl.addEventListener('click', async function () {
    if (!fileUrl) return;
    dl.disabled = true;
    dl.textContent = 'Downloading…';
    try {
      var res = await fetch(fileUrl);
      if (!res.ok) throw new Error('bad status');
      var blob = await res.blob();
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      a.remove();
    } catch (e) {
      var a = document.createElement('a');
      a.href = fileUrl;
      a.download = fileName;
      a.rel = 'noopener';
      document.body.appendChild(a);
      a.click();
      a.remove();
    }
    dl.disabled = false;
    dl.textContent = 'Download for Windows';
  });
</script>
</body>
</html>
